name: Build macOS app (manual only)
on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: Apple Silicon build host
        type: choice
        default: macos-14
        options:
          - macos-14
          - macos-15
          - macos-26
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AppleSilicon
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install isolated build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Analysis and platform regression tests
        run: python -m unittest discover -s tests -v
      - name: Build native app with the approved icon
        run: |
          mkdir -p mac-validation
          python packaging/make_mac_icon.py
          python -m PyInstaller --noconfirm --clean NH3SensorAnalyzer-macOS.spec
          codesign --verify --deep --strict dist/NH3SensorAnalyzer.app
      - name: Verify frozen engine, resources, and app startup
        run: python packaging/verify_mac_bundle.py
      - name: Native Cocoa integration (preview, extraction, ROI, calibration, exports)
        shell: bash
        env:
          PYWEBVIEW_LOG: debug
        run: python tests/desktop_smoke.py > mac-validation/native-smoke.json
      - name: Package app (preserve permissions and symlinks)
        shell: bash
        run: |
          mkdir -p mac-release
          cp MACOS.md mac-release/README.md
          cp -R dist/NH3SensorAnalyzer.app mac-release/
          ditto -c -k --sequesterRsrc --keepParent mac-release "NH3SensorAnalyzer-v1.4.3-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "NH3SensorAnalyzer-v1.4.3-macOS-${{ matrix.arch }}.zip" > mac-validation/SHA256.txt
          python -m pip freeze > mac-validation/dependencies.txt
          git rev-parse HEAD > mac-validation/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NH3SensorAnalyzer-macOS-${{ matrix.arch }}
          path: NH3SensorAnalyzer-v1.4.3-macOS-${{ matrix.arch }}.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-validation-${{ matrix.arch }}
          path: mac-validation/
          retention-days: 14
